# Studio on 5173, Cinema on 5174: static files, with index.html as the fallback for hash-less paths
server {
  listen 5173;
  root /usr/share/nginx/html/studio;
  location / { try_files $uri /index.html; }
}
server {
  listen 5174;
  root /usr/share/nginx/html/cinema;
  location / { try_files $uri /index.html; }
  # the service worker must not be cached for long, or updates never reach installed apps
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
}
