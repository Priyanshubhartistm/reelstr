# One app on 5173: static files, index.html as the fallback. Hash routing means deep links never reach nginx.
server {
  listen 5173;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  # the service worker and manifest must not be cached for long, or updates never reach installed apps
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
}
