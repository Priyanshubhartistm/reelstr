; LND on Mutinynet (a public Lightning signet: valueless coins, real routing between real nodes).
; Chain data comes from a pruned bitcoind (see run.sh). A neutrino light client was tried first and
; stalls at height 4001 on Mutinynet, so it is not an option.
[Application Options]
alias=reelstr-test-b
; listens inside the docker network only (no published port), so a second node of ours can open a channel to it
listen=0.0.0.0:9735
rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080
tlsextradomain=lnd
tlsextradomain=localhost
wallet-unlock-password-file=/secrets/pw
wallet-unlock-allow-create=true
accept-keysend=false
maxpendingchannels=2

[Bitcoin]
bitcoin.active=true
bitcoin.signet=true
; no signetchallenge here: with a bitcoind backend the node validates headers (LND then rejects the chain magic)
bitcoin.node=bitcoind

[Bitcoind]
bitcoind.rpchost=reelstr-bitcoind:38332
bitcoind.rpcuser=reelstr
bitcoind.zmqpubrawblock=tcp://reelstr-bitcoind:28332
bitcoind.zmqpubrawtx=tcp://reelstr-bitcoind:28333

[fee]
fee.url=https://mutinynet.com/api/v1/fees/list
