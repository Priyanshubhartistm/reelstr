# Full stack. Copy .env.example to .env and set PUBLIC_HOST to the address a BROWSER uses to reach this
# machine (localhost for local use, the VM's DNS name or IP when deployed).
#   docker compose up -d                      relay, crew, blossom, postgres, media, indexer, keys, web
#   docker compose --profile mint up -d       + a development Cashu mint (FakeWallet, no real money)
#   docker compose --profile payouts up -d    + the custodial split service (read docs/STATUS.md first)
#   docker compose --profile agent up -d      + a generation agent;  --profile verifier: + a verifier
# Containers reach each other by service name; URL_REWRITE maps the public addresses that appear inside
# published events (blob and mint URLs) to those internal names.
name: reelstr

# One image for every Bun service, built once by `indexer` (the others only reuse the tag)
x-service: &svc
  image: localhost/reelstr-services:latest
  restart: unless-stopped
  environment: &env
    RELAYS: ws://relay:3334
    URL_REWRITE: "http://${PUBLIC_HOST:-localhost}:3100=http://blossom:3100,${MINT_URL:-http://localhost:3338}=http://mint:3338"
services:
  relay:
    build: ../services/relay
    environment:
      POW_BITS: "${POW_BITS:-16}"
    ports: ["3334:3334"]
    volumes: [relay-data:/data]
    restart: unless-stopped

  blossom:
    build: ./blossom
    environment:
      BLOSSOM_PUBLIC_URL: "${BLOSSOM_PUBLIC_URL:-http://localhost:3100}"
    ports: ["3100:3100"]
    volumes: [blossom-data:/data]
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: reelstr
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-reelstr-dev}"
      POSTGRES_DB: reelstr
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    restart: unless-stopped

  # Cashu mint for development only: FakeWallet mints without real Lightning. Never point real funds at it.
  mint:
    image: docker.io/cashubtc/nutshell:latest
    command: ["poetry", "run", "mint"]
    environment:
      MINT_BACKEND_BOLT11_SAT: FakeWallet
      MINT_LISTEN_HOST: 0.0.0.0
      MINT_LISTEN_PORT: "3338"
      MINT_PRIVATE_KEY: "${MINT_PRIVATE_KEY:-dev-only-change-me}"
      MINT_INFO_NAME: reelstr-dev-mint
    ports: ["3338:3338"]
    volumes: [mint-data:/root/.cashu]
    profiles: ["mint"]

  crew:
    build: ../services/crew
    environment:
      RELAY_SECRET: "${CREW_RELAY_SECRET:?set CREW_RELAY_SECRET (64 hex): group state is signed by it}"
      DOMAIN: "${PUBLIC_HOST:-localhost}"
    ports: ["3335:3335"]
    volumes: [crew-data:/data]
    restart: unless-stopped

  media:
    <<: *svc
    image: localhost/reelstr-media:latest
    build:
      context: ..
      target: "${MEDIA_TARGET:-services}"
    command: ["bun", "services/media/src/server.ts"]
    volumes: [media-state:/state]
    environment:
      <<: *env
      PORT: "3200"
      BLOSSOM_URL: http://blossom:3100
      MEDIA_ALLOW: "${MEDIA_ALLOW:-}"
    ports: ["3200:3200"]
    depends_on: [blossom]

  indexer:
    <<: *svc
    build:
      context: ..
      target: services
    command: ["bun", "services/indexer/src/server.ts"]
    environment:
      <<: *env
      PORT: "3300"
      DATABASE_URL: "postgres://reelstr:${POSTGRES_PASSWORD:-reelstr-dev}@postgres:5432/reelstr"
    ports: ["3300:3300"]
    depends_on: [relay, postgres]

  keys:
    <<: *svc
    command: ["bun", "services/keys/src/server.ts"]
    environment:
      <<: *env
      PORT: "3400"
      LEDGER_DB: /state/keys.db
      MINTS: "${MINT_URL:-http://localhost:3338}"
      PHOENIXD_URL: "${PHOENIXD_URL:-}"
      PHOENIXD_PASSWORD: "${PHOENIXD_PASSWORD:-}"
      LND_URL: "${LND_URL:-}"
      LND_MACAROON: "${LND_MACAROON:-}"
    ports: ["3400:3400"]
    volumes: [keys-state:/state]

  split:
    <<: *svc
    command: ["bun", "services/split/src/server.ts"]
    environment:
      <<: *env
      LEDGER_DB: /state/keys.db
      MINTS: "${MINT_URL:-http://localhost:3338}"
      SPLIT_ACKNOWLEDGE_CUSTODY: "${SPLIT_ACKNOWLEDGE_CUSTODY:-}"
      PHOENIXD_URL: "${PHOENIXD_URL:-}"
      PHOENIXD_PASSWORD: "${PHOENIXD_PASSWORD:-}"
      LND_URL: "${LND_URL:-}"
      LND_MACAROON: "${LND_MACAROON:-}"
    volumes: [keys-state:/state]
    profiles: ["payouts"]

  agent:
    <<: *svc
    command: ["bun", "services/agent/src/server.ts"]
    environment:
      <<: *env
      AGENT_NAME: "${AGENT_NAME:-demo-bot}"
      AGENT_NSEC: "${AGENT_NSEC:-}"
      AGENT_LOCK_PRIVKEY: "${AGENT_LOCK_PRIVKEY:-}"
      BLOSSOM_URL: http://blossom:3100
      MEDIA_URL: http://media:3200
      MINT_URL: "${MINT_URL:-http://localhost:3338}"
      AGENT_LEDGER_DB: /state/agent.db
      FAL_KEY: "${FAL_KEY:-}"
      MOCK: "${MOCK:-}"
    volumes: [agent-state:/state]
    depends_on: [media]
    profiles: ["agent"]

  verifier:
    <<: *svc
    command: ["bun", "services/agent/src/verifier-server.ts"]
    environment:
      <<: *env
      VERIFIER_NSEC: "${VERIFIER_NSEC:-}"
      FAL_KEY: "${FAL_KEY:-}"
      MOCK: "${MOCK:-}"
    profiles: ["verifier"]

  web:
    build:
      context: ..
      target: web
      args:
        VITE_RELAYS: "ws://${PUBLIC_HOST:-localhost}:3334"
        VITE_BLOSSOM: "http://${PUBLIC_HOST:-localhost}:3100"
        VITE_MEDIA_URL: "http://${PUBLIC_HOST:-localhost}:3200"
        VITE_INDEXER_URL: "http://${PUBLIC_HOST:-localhost}:3300"
        VITE_KEYS_URL: "http://${PUBLIC_HOST:-localhost}:3400"
        VITE_MINT: "${MINT_URL:-http://localhost:3338}"
        VITE_VERIFIERS: "${VERIFIERS:-}"
        VITE_FIAT_DEMO: "${FIAT_DEMO:-}"
    ports: ["5173:5173"]
    restart: unless-stopped

volumes:
  crew-data:
  keys-state:
  media-state:
  agent-state:
  relay-data:
  blossom-data:
  pg-data:
  mint-data:
